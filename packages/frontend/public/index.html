<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: la página ocupa toda la pantalla del iPhone y se pueden respetar la barra de abajo y el notch. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Ticket It</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        margin: 0;
        background: #f4f6fa;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* En el celular, 100% o 100vh incluyen la barra de Safari y tapan la parte de abajo (por ejemplo las pestañas).
         100dvh es el alto realmente visible, y se ajusta solo cuando la barra aparece o se esconde. */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: 100dvh;
        }
      }

      /* Pantalla de carga: se ve mientras el navegador descarga la app (por ejemplo al recargar con F5).
         Cuando la app arranca, reemplaza todo lo que hay dentro de #root. */
      .carga {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        color: #64748b;
      }
      .carga-marca {
        display: flex;
        align-items: center;
        gap: 12px;
        font-size: 34px;
        font-weight: 700;
        color: #0f172a;
      }
      .carga-marca span {
        color: #ef806c;
      }
      .carga-rueda {
        width: 34px;
        height: 34px;
        border: 4px solid #fdeeea;
        border-top-color: #ef806c;
        border-radius: 50%;
        animation: carga-giro 0.8s linear infinite;
      }
      @keyframes carga-giro {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <noscript>Necesitás activar JavaScript para usar Ticket It.</noscript>
    <div id="root">
      <div class="carga">
        <div class="carga-marca">
          <svg width="56" height="34" viewBox="0 0 100 60" aria-hidden="true">
            <path d="M8 0 H92 a8 8 0 0 1 8 8 V22 a8 8 0 0 0 0 16 V52 a8 8 0 0 1 -8 8 H8 a8 8 0 0 1 -8 -8 V38 a8 8 0 0 0 0 -16 V8 a8 8 0 0 1 8 -8 Z" fill="#EF806C" />
            <text x="32" y="39" fill="#FFFFFF" font-size="26" font-weight="bold" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">AI</text>
            <line x1="62" y1="8" x2="62" y2="52" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="4 5" />
            <polyline points="72,31 78,37 88,25" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <div>Ticket-<span>It</span></div>
        </div>
        <div class="carga-rueda" role="progressbar" aria-label="Cargando"></div>
        <div>Cargando...</div>
      </div>
    </div>
  </body>
</html>
