# Backend (API) para publicar gratis en Render. La web va aparte, en Vercel (ver vercel.json).
services:
  - type: web
    name: ai-ticket-it-api
    runtime: node
    plan: free
    rootDir: packages/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
